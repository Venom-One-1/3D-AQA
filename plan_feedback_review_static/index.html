<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新方法与 F 组 · 定势反馈复核</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/review.css"><script src="/lucide.js" defer></script><script src="/app.js" defer></script></head>
<body>
<header><div class="brand">定势反馈对照复核<span>新方法 / F 组</span></div><div class="toolbar"><span id="progress"></span><span id="saveState" role="status"></span><button id="save" title="保存标注" aria-label="保存标注" disabled><i data-lucide="save"></i></button><button id="export" title="导出 CSV" aria-label="导出 CSV" disabled><i data-lucide="download"></i><span>导出 CSV</span></button></div></header>
<div class="layout"><aside><label for="student">学生</label><select id="student" aria-label="学生"><option value="">全部学生</option></select><label for="move">招式</label><select id="move" aria-label="招式"><option value="">全部招式</option></select><label for="status">复核状态</label><select id="status" aria-label="复核状态"><option value="all">全部案例</option><option value="pending">未完成</option><option value="completed">已完成</option><option value="flagged">自动校验警告</option></select><label for="reviewer">复核人</label><input id="reviewer" aria-label="复核人" maxlength="100" autocomplete="name"><nav id="queue" aria-label="案例列表"></nav></aside>
<main><p id="modelNote" class="context-note"></p><div id="message" role="status" hidden></div><section id="conflict" hidden><strong>本地草稿与服务器标注存在冲突</strong><div><button id="useServer">采用服务器标注</button><button id="keepDraft">保留本地草稿</button></div></section><div id="content"><p>正在加载…</p></div></main></div>
<dialog id="imageDialog"><button id="closeImage" title="关闭大图" aria-label="关闭大图"><i data-lucide="x"></i></button><img id="largeImage" alt="定势帧大图"></dialog>
</body></html>
