<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>动作要领 · 检查计划复核</title>
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/lucide.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><i data-lucide="list-checks"></i><div><strong>动作要领 · 检查计划复核</strong><small id="model">修复版计划</small></div></div>
    <div class="toolbar"><span id="progress" aria-live="polite">载入中</span><button id="save" class="icon-button" title="保存复核进度" aria-label="保存复核进度" disabled><i data-lucide="save"></i></button><button id="export" disabled><i data-lucide="download"></i>导出 CSV</button></div>
  </header>
  <div class="layout">
    <aside>
      <label for="move">招式</label><select id="move" disabled></select>
      <label id="repeatLabel">生成轮次</label><div id="repeats" class="segments" role="group" aria-labelledby="repeatLabel"></div>
      <label for="support">方案支持等级</label><select id="support"><option value="all">全部</option><option value="direct">直接测量</option><option value="proxy">间接代理</option><option value="unsupported">无法测量</option></select>
      <div id="triageFilter" hidden><label for="triage">预审队列</label><select id="triage"><option value="human_queue">人工裁决与抽检</option><option value="all">全部条目</option><option value="needs_review">模型疑问</option><option value="audit_sample">随机抽检</option><option value="auto_pass_provisional">预审通过 · 未校准</option><option value="auto_return">程序退回</option><option value="pending_judge">缺少合法评审</option></select></div>
      <label class="checkbox"><input type="checkbox" id="pending">仅未复核</label>
      <div class="queue-heading"><strong>要领条目</strong><span id="queueCount"></span></div>
      <nav id="queue" aria-label="要领条目"></nav>
    </aside>
    <main>
      <div id="message" class="message" role="status" hidden></div>
      <div id="conflict" class="message error" hidden>服务器标注与本地草稿有冲突。<button id="keepDraft">保留冲突项的本地草稿</button><button id="useServer">采用冲突项的服务器标注</button></div>
      <div id="content"><p class="empty">正在载入检查计划…</p></div>
    </main>
  </div>
  <dialog id="imageDialog"><button id="closeImage" class="icon-button" title="关闭图片" aria-label="关闭图片"><i data-lucide="x"></i></button><img id="largeImage" alt="标准参考结束定势"></dialog>
</body>
</html>
